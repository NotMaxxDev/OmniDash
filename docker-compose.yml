version: '3.8'

services:
  omnidash:
    image: ghcr.io/notmaxxdev/omnidash:latest
    container_name: omnidash
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:./dev.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-omnidash-super-secret-key-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - omnidash_data:/app/prisma
    restart: always

volumes:
  omnidash_data:
